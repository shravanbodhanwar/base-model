version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bel_edidap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bel_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bel_edidap}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bel_admin} -d ${POSTGRES_DB:-bel_edidap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for DB management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bel_edidap_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bel-demo.in
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - admin

volumes:
  postgres_data:
    name: bel_edidap_postgres_data
